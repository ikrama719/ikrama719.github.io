<!DOCTYPE html>
<html>
    <link rel="stylesheet" href="style3.css">
    <head>
        <script>
            function validateForm()
           {
    var lastname = document.forms["form1"]["lastname"].value;
var firstname = document.forms["form1"]["firstname"].value;
var email = document.forms["form1"]["email"].value;
var password1 = document.forms["form1"]["password1"].value;
var password2 = document.forms["form1"]["password2"].value;

if (firstname == null || firstname == "")
{
    alert("Please enter your first name");
    return false;
}

if (lastname == null || lastname == "")
{
    alert("Please enter your last name");
    return false;
}

if ((password1 != password2) || (password1 == ""))
{
    alert("Passwords do not match");
    return false;
}

var foundAt = 0;
var foundDot = 0;

if (email.length > 2)

    for(i = 0; i < email.length; i++)
{
    if(email[i] == '@'){foundAt = i;}
    if(email[i] == '.'){foundDot = i;}
}

if (foundAt > 1 && foundDot > foundAt + 3 && foundDot < email.length - 2)
{
    return true;
}
else
{
    alert("invalid email");
    return false;
}

    return true;
           }
            </script>
    </head>
    <body>
        <title>Login Form</title>
        <link rel="icon" type="image/x-icon" href="https://logodix.com/logo/475508.jpg">

        <form name = "form1" action = "placeholder" onsubmit="return validateForm()">

            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="lastname">

            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="firstname">

            <label for="email">E-Mail</label>
            <input type="text" id="email" name="email">

            
            <label for="password1">Password 1</label>
            <input type="password" id="password1" name="password1">

            <label for="password2">Password 2</label>
            <input type="password" id="password2" name="password2">

            <label for="purpose">Purpose</label>
            <select id="purpose" name="purpose">
                <option value="Business">Business</option>
                    <option value="Pleasure">Pleasure</option>
                        <option value="Both">Both</option>
                        </select>

                        <label for="query">Query</label>
                        <p>
                            <textarea id="query" name="query" rows="4" cols="60">
                        </textarea>

                        <input type="submit" value="submit">

            </form>
        </div>
    </body>
</html>
